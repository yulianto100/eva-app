<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ganti Password - EVA Admin</title>
  <style>
    body{margin:0;min-height:100vh;background:#020617;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;padding:16px}.card{width:100%;max-width:420px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:24px;box-shadow:0 24px 80px rgba(0,0,0,.35)}h1{margin:0 0 6px;font-size:22px}.muted{color:#cbd5e1;font-size:13px;margin:0 0 20px}.msg{padding:10px 12px;border-radius:10px;font-size:14px;margin-bottom:14px}.err{background:rgba(239,68,68,.22);color:#fecaca}.ok{background:rgba(16,185,129,.22);color:#bbf7d0}label{display:block;font-size:14px;margin:14px 0 8px}input{box-sizing:border-box;width:100%;border:0;border-radius:12px;padding:12px 14px;font-size:15px}button,.link{display:inline-block;border:0;border-radius:12px;padding:12px 14px;font-weight:700;text-decoration:none;cursor:pointer}.primary{width:100%;margin-top:18px;background:#10b981;color:#020617}.link{margin-top:14px;color:#e2e8f0;background:rgba(255,255,255,.08)}
  </style>
  <link rel="stylesheet" href="/static/css/eva-redesign.css?v=popup-neutral-20260819-211055">

  {% if eva_account %}<meta name="eva-csrf" content="{{ eva_account.csrf }}"><meta name="eva-role" content="{{ eva_account.role }}">{% endif %}
  <script src="{{ url_for('static', filename='js/eva-account.js') }}?v=google-auth-v4"></script>
</head>
<body>
  <form method="post" class="card">
    <h1>Ganti Password</h1>
    <p class="muted">EVA Admin Dashboard</p>
    {% if error %}<div class="msg err">{{ error }}</div>{% endif %}
    {% if success %}<div class="msg ok">{{ success }}</div>{% endif %}
    <label>Password lama</label>
    <input name="current_password" type="password" required>
    <label>Password baru</label>
    <input name="new_password" type="password" minlength="12" required>
    <label>Konfirmasi password baru</label>
    <input name="confirm_password" type="password" minlength="12" required>
    <button class="primary">Simpan Password</button>
    <a class="link" href="/admin">Kembali</a>
  </form>
</body>
</html>
