<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KMZ Styles - EVA Admin</title>
  <style>
    body{margin:0;min-height:100vh;background:#f1f5f9;color:#0f172a;font-family:Arial,sans-serif}header{background:#020617;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;gap:16px;align-items:center}h1{margin:0;font-size:22px}.sub{margin:4px 0 0;color:#cbd5e1;font-size:13px}.btn{border:0;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.ghost{background:rgba(255,255,255,.1);color:#fff}.wrap{padding:24px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:18px;box-shadow:0 8px 24px rgba(15,23,42,.08);overflow:auto}table{border-collapse:collapse;width:100%;min-width:1350px}th,td{border-bottom:1px solid #e2e8f0;padding:9px;text-align:left;font-size:12px;vertical-align:top}th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#64748b}input{border:1px solid #cbd5e1;border-radius:9px;padding:8px 9px;font-size:12px;box-sizing:border-box}.key{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:800}.color{width:86px}.short{width:80px}.url{width:300px}.save{background:#10b981;color:#020617}.swatch{width:26px;height:26px;border-radius:7px;border:1px solid #cbd5e1;display:inline-block;vertical-align:middle;margin-right:6px}
  </style>
  <link rel="stylesheet" href="/static/css/eva-redesign.css?v=popup-neutral-20260819-211055">
</head>
<body>
  <header>
    <div>
      <h1>KMZ Colors & Icons</h1>
      <p class="sub">Edit semua style standard KMZ: color, icon, scale, line width, opacity.</p>
    </div>
    <a class="btn ghost" href="/admin">Dashboard</a>
  </header>
  <main class="wrap">
    <section class="card">
      <table>
        <thead><tr><th>Style</th><th>Color</th><th>Icon URL</th><th>Scale</th><th>Line Width</th><th>Line Opacity</th><th>Poly Fill Opacity</th><th>Poly Fill</th><th>Poly Outline</th><th>Action</th></tr></thead>
        <tbody>
          {% for row in rows %}
          <tr>
            <form method="post" action="/admin/kmz-styles/{{ row.key }}/save">
              <td><div class="key">{{ row.key }}</div><div style="color:#64748b">{{ row.style_id }}</div></td>
              <td><span class="swatch" style="background:{{ row.color }}"></span><input class="color" name="color" value="{{ row.color }}"></td>
              <td><input class="url" name="icon_href" value="{{ row.icon_href }}"></td>
              <td><input class="short" name="icon_scale" value="{{ row.icon_scale }}"></td>
              <td><input class="short" name="line_width" value="{{ row.line_width }}"></td>
              <td><input class="short" name="line_opacity" value="{{ row.line_opacity }}"></td>
              <td><input class="short" name="poly_fill_opacity" value="{{ row.poly_fill_opacity }}"></td>
              <td><input class="short" name="poly_fill" value="{{ row.poly_fill }}"></td>
              <td><input class="short" name="poly_outline" value="{{ row.poly_outline }}"></td>
              <td><button class="btn save">Save</button></td>
            </form>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </section>
  </main>
</body>
</html>
