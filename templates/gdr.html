<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GDR Dashboard - EVA</title>
  <style>
    :root {
      --brand: #2ecc88;
      --brand-dark: #0f7a4f;
      --brand-soft: #ecfdf5;
      --ink: #0f172a;
      --ink-soft: #64748b;
      --line: #e5e7eb;
      --bg: #f8fafc;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body { background: var(--bg); color: var(--ink); font-family: Inter, system-ui, -apple-system, sans-serif; margin: 0; }
    .gx-page { max-width: 1080px; margin: 0 auto; padding: 1.5rem 1.25rem 2.5rem; display: grid; gap: 1rem; }

    .gx-header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    .gx-header h1 { margin: 0; font-size: 1.4rem; font-weight: 750; letter-spacing: -.02em; }
    .gx-header p { margin: .2rem 0 0; color: var(--ink-soft); font-size: .85rem; }
    .gx-back { color: var(--brand-dark); text-decoration: none; font-size: .82rem; font-weight: 700; padding: .45rem .8rem; border: 1px solid var(--line); border-radius: 999px; background: #fff; white-space: nowrap; }
    .gx-back:hover { background: var(--brand-soft); border-color: var(--brand); }

    .gx-card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 1px 2px rgba(15,23,42,.04); overflow: hidden; }

    .gdr-tabs { display: flex; gap: .25rem; padding: .5rem .5rem 0; border-bottom: 1px solid var(--line); background: #fcfdfe; }
    .gdr-tab { padding: .6rem 1rem; font-size: .82rem; font-weight: 700; cursor: pointer; border: none; background: none; color: var(--ink-soft); border-radius: 10px 10px 0 0; }
    .gdr-tab:hover { color: var(--ink); }
    .gdr-tab.active { background: #fff; color: var(--brand-dark); box-shadow: inset 0 -2px 0 var(--brand); }
    .gdr-tab-content { display: none; padding: 1.25rem; }
    .gdr-tab-content.active { display: block; }

    .gdr-section { border: 1px solid var(--line); border-radius: 16px; background: #fff; padding: 1rem; margin-bottom: 1rem; box-shadow: 0 1px 1px rgba(15,23,42,.025); }
    .gdr-section-head { display:flex; align-items:center; justify-content:space-between; gap:.75rem; margin-bottom:.85rem; }
    .gdr-section-title { margin:0; font-size:.74rem; font-weight:850; letter-spacing:.06em; text-transform:uppercase; color:var(--brand-dark); }
    .gdr-section-hint { color:var(--ink-soft); font-size:.76rem; }
    .gdr-section.pr { background: linear-gradient(180deg,#ffffff 0%,#fbfffd 100%); border-color:#d9f7e8; }
    .gdr-section.material { background: linear-gradient(180deg,#ffffff 0%,#f8fbff 100%); }

    .gx-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: .85rem; align-items: start; }
    .gx-field { display: grid; gap: .35rem; min-width: 0; }
    .gx-field.col2 { grid-column: span 2; }
    .gx-field.col3, .gx-span-full { grid-column: 1 / -1; }
    .gx-field label, .gx-label { color: var(--ink-soft); font-size: .7rem; font-weight: 800; text-transform: uppercase; letter-spacing: .03em; margin: 0; }
    .ui-input { min-height: 2.4rem; width: 100%; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); padding: .45rem .65rem; font-size: .85rem; }
    .ui-input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(46,204,136,.15); }
    .ui-input[readonly] { background: #f1f5f9; color: var(--ink-soft); cursor: not-allowed; }

    .pr-cluster-list { grid-column: 1 / -1; display: grid; gap: .65rem; }
/* ASTRI search in PR/Cluster rows */
    .pr-cluster-row { display: grid; grid-template-columns: 1fr; gap: .65rem; align-items: start; padding: .75rem; border: 1px solid var(--line); border-radius: 12px; background: #fbfdff; }
    .pr-cluster-fields { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 2.35rem; gap: .65rem; align-items: end; }
    .pr-cluster-fields .remove-btn { height: 2.4rem; width: 2.35rem; align-self: end; }
    .astri-search-bar { display: grid; grid-template-columns: 1fr auto auto; gap: .5rem; align-items: end; }
    .astri-search-bar select { max-width: 7rem; }
    .astri-search-bar .btn-astri-search { height: 2.4rem; padding: 0 .7rem; font-size: .75rem; font-weight: 800; background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; border-radius: 8px; cursor: pointer; white-space: nowrap; }
    .astri-search-bar .btn-astri-search:hover { background: #bae6fd; }
    .astri-results { max-height: 10rem; overflow-y: auto; border: 1px solid var(--line); border-radius: 10px; background: #fff; margin-top: .35rem; }
    .astri-results:empty { display: none; }
    .astri-result-item { padding: .45rem .65rem; font-size: .78rem; cursor: pointer; border-bottom: 1px solid #f1f5f9; display: grid; grid-template-columns: 1fr auto; gap: .5rem; align-items: center; }
    .astri-result-item:last-child { border-bottom: none; }
    .astri-result-item:hover { background: var(--brand-soft); }
    .astri-result-item .ari-name { font-weight: 600; color: var(--ink); }
    .astri-result-item .ari-pr { font-size: .72rem; color: var(--ink-soft); }
    .astri-result-item .ari-type { font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: .15rem .4rem; border-radius: 6px; background: #f0fdf4; color: #166534; }
    .astri-searching { font-size: .76rem; color: var(--ink-soft); padding: .45rem .65rem; }
    @media (max-width: 560px) { .pr-cluster-fields { grid-template-columns: 1fr; } .pr-cluster-fields .remove-btn { width: 100%; } .astri-search-bar { grid-template-columns: 1fr; } }
    .material-row { display: grid; grid-template-columns: 1fr 6rem 3.5rem 2.2rem; gap: .5rem; align-items: center; margin-bottom: .5rem; }
    .material-row .muted { font-size: .76rem; color: var(--ink-soft); text-align: center; }
    .remove-btn { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; padding: .4rem; font-size: .75rem; font-weight: 700; cursor: pointer; border-radius: 8px; }
    .remove-btn:hover { background: #fee2e2; }

    .btn { border-radius: 10px; padding: .6rem 1.1rem; font-size: .85rem; font-weight: 700; cursor: pointer; border: 1px solid transparent; }
    .btn-primary, .primary-button { background: var(--brand); color: #06301f; border-color: var(--brand-dark); border-radius: 10px; padding: .6rem 1.1rem; font-size: .85rem; font-weight: 700; cursor: pointer; }
    .btn-primary:hover, .primary-button:hover { background: #27b97a; }
    .secondary-button { background: #fff; color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: .5rem .85rem; font-size: .8rem; font-weight: 700; cursor: pointer; }
    .secondary-button:hover { background: #f8fafc; }

    .gx-actions { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; margin-top: 1rem; }
    .gx-divider { height: 1px; background: var(--line); margin: 1.1rem 0; border: none; }
    .muted { color: var(--ink-soft); font-size: .82rem; }
    #gdrStatus { font-size: .82rem; color: var(--ink-soft); }

    .gx-table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: .55rem .65rem; text-align: left; font-size: .8rem; border-bottom: 1px solid var(--line); }
    th { background: #f1f5f9; font-size: .68rem; font-weight: 800; text-transform: uppercase; letter-spacing: .03em; color: var(--ink-soft); }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: #f8fafc; }
    td strong { font-weight: 700; }
    .add-mat-btn { width: 100%; border: 1px dashed #cbd5e1; background: #fcfdfe; color: var(--brand-dark); padding: .65rem; font-size: .82rem; font-weight: 800; cursor: pointer; border-radius: 12px; }
    .add-mat-btn:hover { background: var(--brand-soft); border-color: var(--brand); }
    @media (max-width: 820px) { .gx-grid { grid-template-columns: 1fr 1fr; } .gx-field.col2, .gx-field.col3, .gx-span-full { grid-column: 1 / -1; } }
    @media (max-width: 560px) { .gx-grid { grid-template-columns: 1fr; } .pr-cluster-fields { grid-template-columns: 1fr; } .pr-cluster-fields .remove-btn { width: 100%; } .astri-search-bar { grid-template-columns: 1fr; } .material-row { grid-template-columns: 1fr 4.5rem 2rem; } .material-row .muted { display: none; } }
  </style>

<body>
  <main class="gx-page">
    <header class="gx-header">
      <div>
        <h1>GDR Dashboard</h1>
        <p>Buat GDR manual, isi material, kelola vendor, dan generate dokumen.</p>
      </div>
      <a href="/" class="gx-back" id="backToEvaLink">Kembali</a>
    </header>

    <section class="gx-card">
      <div class="gdr-tabs">
        <button class="gdr-tab active" data-tab="create">Buat GDR</button>
        <button class="gdr-tab" data-tab="vendors">Kelola Vendor</button>
        <button class="gdr-tab" data-tab="history">Riwayat GDR</button>
      </div>

      <!-- TAB: Buat GDR -->
      <div class="gdr-tab-content active" id="tab-create">
        <section class="gdr-section pr">
          <div class="gdr-section-head">
            <h2 class="gdr-section-title">Informasi GDR</h2>
            <span class="gdr-section-hint">PR + Cluster bisa lebih dari satu</span>
          </div>
          <div class="gx-grid">
            <div class="gx-field col3"><label for="gdrVendor">Vendor</label><select id="gdrVendor" class="ui-input"><option value="">Pilih Vendor</option></select></div>
            <div id="prClusterList" class="pr-cluster-list"></div>
            <button type="button" class="add-mat-btn gx-span-full" id="addPrClusterBtn">+ Tambah PR / Cluster</button>
            <div class="gx-field"><label for="gdrNumber">No. GDR</label><input id="gdrNumber" class="ui-input" placeholder="Auto generate" readonly></div>
            <div class="gx-field"><label for="gdrArea">Area</label><input id="gdrArea" class="ui-input" placeholder="BEKASI"></div>
            <div class="gx-field"><label for="gdrDate">Tanggal</label><input id="gdrDate" class="ui-input" type="date"></div>
            <div class="gx-field"><label for="gdrPmo">PMO</label><input id="gdrPmo" class="ui-input" placeholder="NRO"></div>
            <div class="gx-field"><label for="gdrRequestName">Request by - Name</label><input id="gdrRequestName" class="ui-input" placeholder="Nandi"></div>
            <div class="gx-field"><label for="gdrRequestMobile">Request by - Mobile</label><input id="gdrRequestMobile" class="ui-input" placeholder="0857..."></div>
            <div class="gx-field"><label for="gdrApproveName">Approve by - Name</label><input id="gdrApproveName" class="ui-input" placeholder="Albertus..."></div>
            <div class="gx-field"><label for="gdrApproveMobile">Approve by - Mobile</label><input id="gdrApproveMobile" class="ui-input" placeholder="0818..."></div>
          </div>
        </section>

        <section class="gdr-section material">
          <div class="gdr-section-head">
            <h2 class="gdr-section-title">Material</h2>
            <button type="button" id="fetchAstriMaterialsBtn" class="secondary-button" style="font-size:.7rem;padding:.2rem .5rem;">Ambil dari ASTRI</button>
          <span class="gdr-section-hint">Pilih item dan qty</span>
          </div>
          <div id="materialList"></div>
          <button type="button" class="add-mat-btn" id="addMaterialBtn">+ Tambah Material</button>
        </section>

        <div class="gx-actions">
          <button type="button" class="btn-primary" id="generateGdrBtn">Generate GDR</button>
          <button type="button" class="secondary-button" id="clearGdrBtn">Kosongkan</button>
          <span id="gdrStatus"></span>
        </div>
      </div>

      <!-- TAB: Kelola Vendor -->
      <div class="gdr-tab-content" id="tab-vendors">
        <div class="gx-grid">
          <div class="gx-field"><label for="vendorCode">Kode Vendor</label><input id="vendorCode" class="ui-input" placeholder="ITM, DBI, ALM..."></div>
          <div class="gx-field col2"><label for="vendorName">Nama Vendor + Area</label><input id="vendorName" class="ui-input" placeholder="ITM BEKASI"></div>
          <div class="gx-field col3"><label for="vendorOrigin">Origin</label><input id="vendorOrigin" class="ui-input" placeholder="EMR"></div>
          <div class="gx-field col3"><label for="vendorDest">Destination</label><input id="vendorDest" class="ui-input" placeholder="Alamat lengkap"></div>
          <div class="gx-field col3"><label for="vendorPic">PIC</label><input id="vendorPic" class="ui-input" placeholder="Nama - telp - email"></div>
        </div>
        <div class="gx-actions">
          <button type="button" class="btn-primary" id="saveVendorBtn">Simpan Vendor</button>
          <button type="button" class="secondary-button" id="clearVendorBtn">Kosongkan</button>
        </div>
        <hr class="gx-divider">
        <div class="gx-table-wrap">
          <table>
            <thead><tr><th>Kode</th><th>Nama</th><th>Origin</th><th>Destination</th><th>PIC</th><th>Aksi</th></tr></thead>
            <tbody id="vendorTableBody"></tbody>
          </table>
        </div>
      </div>

      <!-- TAB: Riwayat -->
      <div class="gdr-tab-content" id="tab-history">
        <p class="muted" style="margin-top:0;">Riwayat GDR yang sudah digenerate.</p>
        <div class="gx-table-wrap">
          <table>
            <thead><tr><th>No. GDR</th><th>Vendor</th><th>Tanggal</th><th>PR</th><th>Cluster</th><th>Items</th><th>Aksi</th></tr></thead>
            <tbody id="historyTableBody"><tr><td colspan="7" class="muted">Belum ada riwayat.</td></tr></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>
<script src="/static/js/toast.js?v=glass-mint-transparent-20260630b"></script>
<script>
document.getElementById('backToEvaLink')?.addEventListener('click', (event) => {
  if (window.parent && window.parent !== window) {
    event.preventDefault();
    window.parent.postMessage({ type: 'eva-close-gdr-modal' }, window.location.origin);
  }
});

// Tabs
document.querySelectorAll('.gdr-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.gdr-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.gdr-tab-content').forEach(c => c.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
  });
});

function escapeHtml(v){ return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
async function api(url, opts={}){ const r=await fetch(url,{credentials:'include',...opts}); const d=await r.json().catch(()=>({})); if(!r.ok) throw new Error(d.error||r.statusText); return d; }

// Material definitions (same as bot)
const MATERIALS = [
  { name: 'FO core type SM G.652.D-ADSS 24 cores', unit: 'Meter' },
  { name: 'FO core type SM G.652.D-ADSS 36 cores', unit: 'Meter' },
  { name: 'FO core type SM G.652.D-ADSS 48 cores', unit: 'Meter' },
  { name: 'FO core type SM G.652.D-ADSS 96 cores', unit: 'Meter' },
  { name: 'FO core type SM G.652.D-ADSS 144 cores', unit: 'Meter' },
  { name: 'FO core type SM G.652.D-ADSS 288 cores', unit: 'Meter' },
  { name: '144 cores capacity ground mounted FDT', unit: 'Unit' },
  { name: '72 cores capacity pole mounted FDT', unit: 'Unit' },
  { name: '48 cores capacity pole mounted FDT', unit: 'Unit' },
  { name: 'Pedestal mounted type (16 ports type)', unit: 'Unit' },
  { name: 'Pole mounted outdoor type (16 ports type)', unit: 'Unit' },
  { name: 'Pengadaan Tiang 7 meter 4", STEL L-003 1996', unit: 'Set' },
  { name: 'Pengadaan Tiang 7 meter 3 inch', unit: 'Set' },
  { name: 'Pole / Tiang Udara 7 Meter 2.5', unit: 'Set' },
  { name: 'Sub Duct / HDPE 32/26 warna hitam, 3 strip ungu', unit: 'Meter' },
  { name: 'Sub Duct / HDPE 40/34 warna Ungu, 3 Strip Putih', unit: 'Meter' },
  { name: 'Precast Hand hole for FDT : 80 x 80 x 130 cm', unit: 'Unit' },
  { name: 'Precast Hand hole for FAT : 40 x 40 x 60 cm', unit: 'Unit' },
  { name: 'Precast Hand hole for pulling pit : 20x20x20 cm', unit: 'Unit' },
];

let materialRows = [];

function renderMaterials() {
  const list = document.getElementById('materialList');
  list.innerHTML = materialRows.map((row, idx) => `
    <div class="material-row">
      <select class="ui-input mat-select" data-idx="${idx}">
        <option value="">Pilih material</option>
        ${MATERIALS.some(m => m.name === row.name)
          ? MATERIALS.map(m => `<option value="${escapeHtml(m.name)}" ${row.name===m.name?'selected':''}>${escapeHtml(m.name)}</option>`).join('')
          : `<option value="${escapeHtml(row.name)}" selected>${escapeHtml(row.name)}</option>`
            + MATERIALS.map(m => `<option value="${escapeHtml(m.name)}">${escapeHtml(m.name)}</option>`).join('')
        }
      </select>
      <input class="ui-input mat-qty" data-idx="${idx}" type="number" min="0" placeholder="Qty" value="${row.qty||''}">
      <span class="muted">${escapeHtml(row.unit||'')}</span>
      ${row.pr_breakdown?.length ? `<div class="muted" style="grid-column:1 / -1;font-size:.72rem;margin-top:-.15rem;">${escapeHtml(row.pr_breakdown.map(p => `${p.pr_number || 'NO_PR'}: ${p.qty}`).join(' · '))}</div>` : ''}
      <button type="button" class="remove-btn" data-idx="${idx}">X</button>
    </div>
  `).join('');
}

document.getElementById('addMaterialBtn').addEventListener('click', () => {
  materialRows.push({ name: '', qty: 0, unit: '' });
  renderMaterials();
});

document.getElementById('materialList').addEventListener('change', (e) => {
  const idx = Number(e.target.dataset.idx);
  if (e.target.classList.contains('mat-select')) {
    materialRows[idx].name = e.target.value;
    const mat = MATERIALS.find(m => m.name === e.target.value);
    materialRows[idx].unit = mat ? mat.unit : '';
    renderMaterials();
  }
});
document.getElementById('materialList').addEventListener('input', (e) => {
  if (e.target.classList.contains('mat-qty')) {
    materialRows[Number(e.target.dataset.idx)].qty = Number(e.target.value) || 0;
  }
});
document.getElementById('materialList').addEventListener('click', (e) => {
  if (e.target.classList.contains('remove-btn')) {
    materialRows.splice(Number(e.target.dataset.idx), 1);
    renderMaterials();
  }
});


let prClusterRows = [{ pr_number: '', cluster: '', cluster_code: '', vendor_label: '', target_type: 'auto' }];
let _astriSearchTimers = {};

function renderPrClusters() {
  const list = document.getElementById('prClusterList');
  list.innerHTML = prClusterRows.map((row, idx) => `
    <div class="pr-cluster-row" data-pr-idx="${idx}">
      <div class="astri-search-bar">
        <div class="gx-field"><label>Cari di ASTRI</label><input id="astriSearch_${idx}" data-idx="${idx}" class="ui-input astri-search-input" placeholder="Ketik nama/kode cluster, subfeeder, feeder..."></div>
        <div class="gx-field"><label>Tipe</label><select id="astriType_${idx}" data-idx="${idx}" class="ui-input astri-type-select">
          <option value="auto">Auto</option>
          <option value="cluster">Cluster</option>
          <option value="subfeeder">Subfeeder</option>
          <option value="feeder">Feeder</option>
        </select></div>
        <button type="button" class="btn-astri-search" data-idx="${idx}" data-search-astri="1">🔍 Cari</button>
      </div>
      <div id="astriResults_${idx}" class="astri-results"></div>
      <div class="pr-cluster-fields">
        <div class="gx-field"><label for="prNumber_${idx}">PR Number</label><input id="prNumber_${idx}" data-idx="${idx}" class="ui-input pr-number-input" placeholder="Auto dari ASTRI / manual" value="${escapeHtml(row.pr_number)}"></div>
        <div class="gx-field"><label for="cluster_${idx}">Cluster / Roll Out</label><input id="cluster_${idx}" data-idx="${idx}" class="ui-input cluster-input" placeholder="Auto dari ASTRI / manual" value="${escapeHtml(row.cluster)}"></div>
        ${prClusterRows.length > 1 ? `<button type="button" class="remove-btn" data-remove-pr-cluster="${idx}" aria-label="Hapus PR Cluster">×</button>` : '<span></span>'}
      </div>
    </div>
  `).join('');
}

async function searchAstri(idx) {
  const searchInput = document.getElementById(`astriSearch_${idx}`);
  const typeSelect = document.getElementById(`astriType_${idx}`);
  const resultsDiv = document.getElementById(`astriResults_${idx}`);
  if (!searchInput || !resultsDiv) return;
  const q = searchInput.value.trim();
  const type = typeSelect ? typeSelect.value : 'auto';
  if (q.length < 2) { resultsDiv.innerHTML = ''; return; }
  resultsDiv.innerHTML = '<div class="astri-searching">Mencari di ASTRI...</div>';
  try {
    const data = await api(`/api/astri/search?q=${encodeURIComponent(q)}&type=${encodeURIComponent(type)}`);
    if (!data.items || !data.items.length) {
      resultsDiv.innerHTML = '<div class="astri-searching">Tidak ditemukan.</div>';
      return;
    }
    const rankedItems = [...data.items].sort((a, b) => {
      const rank = (item) => {
        const t = (item.target_type || '').toLowerCase();
        const code = (item.cluster_code || item.subfeeder_code || item.feeder_code || '').toLowerCase();
        const name = (item.cluster_name || item.subfeeder_name || item.feeder_name || '').toLowerCase();
        const qn = q.toLowerCase();
        let s = 0;
        if (t === 'cluster') s += 100;
        else if (t === 'subfeeder') s += 50;
        else if (t === 'feeder') s += 25;
        if (code === qn) s += 40;
        if (name === qn) s += 30;
        if (code.includes(qn)) s += 20;
        if (name.includes(qn)) s += 10;
        if (item.pr_number) s += 5;
        return s;
      };
      return rank(b) - rank(a);
    });
    resultsDiv.innerHTML = rankedItems.map((item, i) => {
      const name = item.cluster_name || item.subfeeder_name || item.feeder_name || '-';
      const code = item.cluster_code || item.subfeeder_code || item.feeder_code || '';
      const pr = item.pr_number || '';
      const prLabel = pr || 'Belum ada No PR';
      const wo = item.work_order_number || '';
      const ttype = item.target_type || type;
      return `<div class="astri-result-item" data-astri-pick="${idx}" data-astri-i="${i}"
                   data-pr-number="${escapeHtml(pr)}" data-wo="${escapeHtml(wo)}" data-cluster="${escapeHtml(name)}" data-code="${escapeHtml(code)}" data-vendor="${escapeHtml(item.vendor_label || '')}" data-target-type="${escapeHtml(ttype)}">
        <div><span class="ari-name">${escapeHtml(name)}</span> <span class="ari-pr">PR: ${escapeHtml(prLabel)}</span></div>
        <span class="ari-type">${escapeHtml(ttype)}</span>
      </div>`;
    }).join('');
    if (rankedItems.length === 1) {
      const top = resultsDiv.querySelector('[data-astri-pick]');
      if (top) top.click();
    }
  } catch (err) {
    resultsDiv.innerHTML = `<div class="astri-searching" style="color:#dc2626">Error: ${escapeHtml(err.message)}</div>`;
  }
}

document.getElementById('addPrClusterBtn').addEventListener('click', () => {
  prClusterRows.push({ pr_number: '', work_order_number: '', cluster: '', cluster_code: '', vendor_label: '', target_type: 'auto' });
  renderPrClusters();
});

document.getElementById('prClusterList').addEventListener('input', (e) => {
  const idx = Number(e.target.dataset.idx);
  if (e.target.classList.contains('pr-number-input')) {
    prClusterRows[idx].pr_number = e.target.value;
  } else if (e.target.classList.contains('cluster-input')) {
    prClusterRows[idx].cluster = e.target.value;
  } else if (e.target.classList.contains('astri-search-input')) {
    // Debounce ASTRI search
    clearTimeout(_astriSearchTimers[idx]);
    _astriSearchTimers[idx] = setTimeout(() => searchAstri(idx), 400);
  }
});

document.getElementById('prClusterList').addEventListener('click', (e) => {
  // Remove PR/Cluster row
  if (e.target.dataset.removePrCluster) {
    const idx = Number(e.target.dataset.removePrCluster);
    prClusterRows.splice(idx, 1);
    renderPrClusters();
    return;
  }
  // Search ASTRI button
  if (e.target.dataset.searchAstri) {
    searchAstri(Number(e.target.dataset.idx));
    return;
  }
  // Pick ASTRI result
  const pick = e.target.closest('[data-astri-pick]');
  if (pick) {
    const idx = Number(pick.dataset.astriPick);
    prClusterRows[idx].pr_number = pick.dataset.prNumber || '';
    prClusterRows[idx].work_order_number = pick.dataset.wo || '';
    prClusterRows[idx].cluster = pick.dataset.cluster || '';
    prClusterRows[idx].cluster_code = pick.dataset.code || '';
    prClusterRows[idx].vendor_label = pick.dataset.vendor || '';
    prClusterRows[idx].target_type = pick.dataset.targetType || 'cluster';
    renderPrClusters();
  }
});

// Vendor management

function renderVendorSelect() {
  const sel = document.getElementById('gdrVendor');
  sel.innerHTML = '<option value="">Pilih Vendor</option>' + Object.entries(vendors).map(([code, v]) =>
    `<option value="${escapeHtml(code)}">${escapeHtml(code)} - ${escapeHtml((v.vendor_name||'').replace(/^:\s*/,''))}</option>`

function renderVendorTable() {
  const body = document.getElementById('vendorTableBody');
  const entries = Object.entries(vendors);
  if (!entries.length) { body.innerHTML = '<tr><td colspan="6" class="muted">Belum ada vendor.</td></tr>'; return; }
  body.innerHTML = entries.map(([code, v]) => `<tr>

    <td>${escapeHtml((v.origin||'').replace(/^:\s*/,''))}</td>

    <td>${escapeHtml((v.pic||'').replace(/^:\s*/,''))}</td>

    document.getElementById('vendorDest').value = (v.destination||'').replace(/^:\s*/,'');

document.getElementById('saveVendorBtn').addEventListener('click', async () => {
  const code = document.getElementById('vendorCode').value.trim().toUpperCase();
  if (!code) return alert('Kode vendor wajib diisi');
  const data = {
    vendor_name: ': ' + document.getElementById('vendorName').value.trim(),
    origin: ': ' + (document.getElementById('vendorOrigin').value.trim() || 'EMR'),
    destination: ': ' + document.getElementById('vendorDest').value.trim(),
    pic: ': ' + document.getElementById('vendorPic').value.trim(),
  };

  await

document.getElementById('clearVendorBtn').addEventListener('click', () => {

});

// Generate GDR
document.getElementById('generateGdrBtn').addEventListener('click', async () => {
  const vendor = document.getElementById('gdrVendor').value;
  if (!vendor) return alert('Pilih vendor dulu');
  const items = materialRows.filter(m => m.name && m.qty > 0);
  if (!items.length) return alert('Tambah minimal 1 material');
  const status = document.getElementById('gdrStatus');
  status.textContent = 'Generating...';
  try {
    const result = await api('/api/gdr/generate', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        vendor,
        clusters: prClusterRows.filter(r => r.pr_number || r.cluster),
        area: document.getElementById('gdrArea').value.trim(),
        pmo: document.getElementById('gdrPmo').value.trim(),
        request_name: document.getElementById('gdrRequestName').value.trim(),
        request_mobile: document.getElementById('gdrRequestMobile').value.trim(),
        approve_name: document.getElementById('gdrApproveName').value.trim(),
        approve_mobile: document.getElementById('gdrApproveMobile').value.trim(),
        materials: items.map(m => ({ name: m.name, qty: m.qty, unit: m.unit, pr_breakdown: m.pr_breakdown || [] })),
      }),
    });
    document.getElementById('gdrNumber').value = result.gdr_label || '';
    status.textContent = `GDR berhasil dibuat: ${result.gdr_label}`;
    if (window.parent && window.parent.evaAssistantNotify) {
      window.parent.evaAssistantNotify({ title: 'GDR Dibuat', message: result.gdr_label, tone: 'success' });
    }
    if (result.download_url) {
      const a = document.createElement('a');
      a.href = result.download_url;
      a.download = '';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
    loadHistory();
  } catch (err) {
    status.textContent = 'Error: ' + err.message;
  }
});

document.getElementById('clearGdrBtn').addEventListener('click', () => {

  renderPrClusters();
  document.getElementById('gdrArea').value = '';

  document.getElementById('gdrRequestName').value = '';

// ── Fetch internal materials from all selected ASTRI rows ────────────────────
function normalizeMaterialName(name) {
  return (name || '').replace(/\s+/g, ' ').trim().toUpperCase();
}
function normalizeMaterialUnit(unit) {
  return (unit || '').replace(/\s+/g, ' ').trim().toUpperCase();
}
function mergeAstriMaterials(rows) {
  const merged = new Map();
  rows.forEach((mat) => {
    const name = (mat.name || '').trim();
    const unit = (mat.unit || '').trim();
    const qty = Number(mat.qty) || 0;
    if (!name || qty <= 0) return;
    const prNumber = ((mat._source && mat._source.pr_number) || mat.pr_number || '').trim();
    const key = `${normalizeMaterialName(name)}|${normalizeMaterialUnit(unit)}`;
    if (!merged.has(key)) {
      merged.set(key, { name, qty, unit, pr_breakdown: [] });
    } else {
      const prev = merged.get(key);
      prev.qty = Number((prev.qty + qty).toFixed(6));
    }
    const row = merged.get(key);
    const prKey = prNumber || 'NO_PR';
    const existing = row.pr_breakdown.find(p => (p.pr_number || 'NO_PR') === prKey);
    if (existing) {
      existing.qty = Number((Number(existing.qty || 0) + qty).toFixed(6));
    } else {
      row.pr_breakdown.push({ pr_number: prNumber, qty });
    }
  });
  return Array.from(merged.values()).sort((a, b) => a.name.localeCompare(b.name));
}

document.getElementById('fetchAstriMaterialsBtn')
  ?.addEventListener('click', async () => {
    const statusEl = document.getElementById('gdrStatus');
    const sources = prClusterRows
      .map((row, idx) => ({
        idx,
        pr_number: (row.pr_number || '').trim(),
        work_order_number: (row.work_order_number || '').trim(),
        cluster_code: (row.cluster_code || row.cluster || '').trim(),
        vendor_label: (row.vendor_label || document.getElementById('gdrVendor').value || '').trim(),
        target_type: (row.target_type || 'cluster').trim(),
      }))
      .filter(row => row.work_order_number && row.cluster_code);

    if (!sources.length) {
      alert('Isi minimal 1 Cluster/Subfeeder/Feeder dari ASTRI dulu.');
      return;
    }

    statusEl.textContent = `Mengambil material internal dari ${sources.length} sumber ASTRI...`;
    try {
      const results = await Promise.all(sources.map(async (source) => {
        const params = new URLSearchParams({
          pr_number: source.pr_number,
          work_order_number: source.work_order_number,
          cluster_code: source.cluster_code,
          vendor_label: source.vendor_label,
          target_type: source.target_type,
        });
        const res = await api('/api/gdr/fetch-astri-materials?' + params.toString());
        return (res.materials || []).map(mat => ({
          name: mat.description || mat.name || '',
          qty: Number(mat.material_qty || mat.qty || 0),
          unit: mat.remarks || mat.unit || 'UNIT',
          _code: mat.code || '',
          _source: source,
        }));
      }));

      const flat = results.flat();
      materialRows = mergeAstriMaterials(flat);
      renderMaterials();

      if (materialRows.length) {
        statusEl.textContent = `${materialRows.length} jenis material internal digabung dari ${sources.length} sumber ASTRI (${flat.length} baris).`;
      } else {
        statusEl.textContent = `Tidak ada material internal ditemukan dari ${sources.length} sumber ASTRI.`;
      }
    } catch (err) {
      showPopup('Error ambil material ASTRI: ' + err.message, true); statusEl.textContent = '';
    }
  });

</script>
