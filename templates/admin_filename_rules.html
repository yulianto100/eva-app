<!doctype html>
  <link rel="stylesheet" href="/static/css/eva-redesign.css?v=popup-neutral-20260819-211055">

  {% if eva_account %}<meta name="eva-csrf" content="{{ eva_account.csrf }}"><meta name="eva-role" content="{{ eva_account.role }}">{% endif %}
  <script src="{{ url_for('static', filename='js/eva-account.js') }}?v=google-auth-v4"></script>
</head><body><header><div><h1 style="margin:0">Filename Rule Manager</h1><p style="margin:4px 0 0;color:#cbd5e1">Edit format nama file untuk popup validation.</p></div><a class="btn ghost" href="/admin">Dashboard</a></header><main class="wrap">{% if error %}<div class="err">{{ error }}</div>{% endif %}{% if success %}<div class="ok">{{ success }}</div>{% endif %}<section class="grid">{% for scope, rule in rules.items() %}<form class="card" method="post"><input type="hidden" name="scope" value="{{ scope }}"><h2>{{ scope }}</h2><label>Regex Pattern</label><input name="pattern" value="{{ rule.pattern }}"><label>Sample benar</label><input name="sample" value="{{ rule.sample }}"><label>Checklist (1 baris per item)</label><textarea name="checklist">{{ (rule.checklist or [])|join('\n') }}</textarea><button class="btn save" style="margin-top:14px">Save {{ scope }}</button></form>{% endfor %}</section></main></body></html>
