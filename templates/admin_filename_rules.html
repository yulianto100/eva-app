<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Filename Rules</title><style>body{margin:0;background:#f6f8fb;color:#111827;font-family:Arial,sans-serif}header{background:#0b1220;color:white;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800;text-decoration:none;cursor:pointer}.ghost{background:rgba(255,255,255,.1);color:white}.save{background:#10b981;color:#052e16}.wrap{padding:24px;display:grid;gap:16px}.card{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:18px;box-shadow:0 10px 30px rgba(15,23,42,.08)}label{display:block;font-size:12px;text-transform:uppercase;font-weight:900;color:#64748b;margin:12px 0 6px}input,textarea{width:100%;border:1px solid #cbd5e1;border-radius:12px;padding:11px 12px;font-family:ui-monospace,Menlo,monospace;box-sizing:border-box}textarea{min-height:92px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}.ok{background:#dcfce7;color:#166534;padding:10px;border-radius:12px}.err{background:#fee2e2;color:#991b1b;padding:10px;border-radius:12px}</style></head><body><header><div><h1 style="margin:0">Filename Rule Manager</h1><p style="margin:4px 0 0;color:#cbd5e1">Edit format nama file untuk popup validation.</p></div><a class="btn ghost" href="/admin">Dashboard</a></header><main class="wrap">{% if error %}<div class="err">{{ error }}</div>{% endif %}{% if success %}<div class="ok">{{ success }}</div>{% endif %}<section class="grid">{% for scope, rule in rules.items() %}<form class="card" method="post"><input type="hidden" name="scope" value="{{ scope }}"><h2>{{ scope }}</h2><label>Regex Pattern</label><input name="pattern" value="{{ rule.pattern }}"><label>Sample benar</label><input name="sample" value="{{ rule.sample }}"><label>Checklist (1 baris per item)</label><textarea name="checklist">{{ (rule.checklist or [])|join('\n') }}</textarea><button class="btn save" style="margin-top:14px">Save {{ scope }}</button></form>{% endfor %}</section></main></body></html>
