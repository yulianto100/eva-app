</head><body><header><div><h1 style="margin:0">Dry-run Preview</h1><p style="margin:4px 0 0;color:#cbd5e1">Preview perubahan KMZ tanpa generate output final.</p></div><a class="btn ghost" href="/admin">Dashboard</a></header><main class="wrap"><section class="card"><form id="form" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><input type="file" name="file" accept=".kml,.kmz" required><select name="scope_type"><option>Cluster</option><option>Feeder</option><option>Subfeeder</option></select><select name="network_type"><option>AE</option><option>UG</option></select><button class="btn run">Preview</button></form></section><section class="card"><div id="summary" class="grid"></div><h3>Changes</h3><pre id="out">Upload file untuk mulai dry-run.</pre></section></main><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const fd=new FormData(e.target);out.textContent='Processing...';summary.innerHTML='';const r=await fetch('/api/dashboard/dry-run',{method:'POST',body:fd});const d=await r.json();if(!r.ok){out.textContent=d.error||'Error';return}const s=d.summary||{};summary.innerHTML=['scope_type','network_type','matched_project','matched_site','match_score'].map(k=>`<div class="kv"><span>${k}</span><b>${s[k]??'-'}</b></div>`).join('');out.textContent=JSON.stringify(s,null,2);});</script></body></html>
