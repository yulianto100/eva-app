<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dry-run Preview</title><style>body{margin:0;background:#f6f8fb;color:#111827;font-family:Arial,sans-serif}header{background:#0b1220;color:white;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800;text-decoration:none;cursor:pointer}.ghost{background:rgba(255,255,255,.1);color:white}.run{background:#10b981;color:#052e16}.wrap{padding:24px;display:grid;gap:16px}.card{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:18px;box-shadow:0 10px 30px rgba(15,23,42,.08)}input,select{border:1px solid #cbd5e1;border-radius:12px;padding:11px 12px}pre{white-space:pre-wrap;background:#0f172a;color:#e2e8f0;border-radius:14px;padding:14px;max-height:520px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.kv{border:1px solid #e5e7eb;border-radius:12px;padding:10px;background:#fafafa}.kv span{font-size:11px;font-weight:900;color:#64748b;text-transform:uppercase}.kv b{display:block;margin-top:6px}</style></head><body><header><div><h1 style="margin:0">Dry-run Preview</h1><p style="margin:4px 0 0;color:#cbd5e1">Preview perubahan KMZ tanpa generate output final.</p></div><a class="btn ghost" href="/admin">Dashboard</a></header><main class="wrap"><section class="card"><form id="form" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><input type="file" name="file" accept=".kml,.kmz" required><select name="scope_type"><option>Cluster</option><option>Feeder</option><option>Subfeeder</option></select><select name="network_type"><option>AE</option><option>UG</option></select><button class="btn run">Preview</button></form></section><section class="card"><div id="summary" class="grid"></div><h3>Changes</h3><pre id="out">Upload file untuk mulai dry-run.</pre></section></main><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const fd=new FormData(e.target);out.textContent='Processing...';summary.innerHTML='';const r=await fetch('/api/dashboard/dry-run',{method:'POST',body:fd});const d=await r.json();if(!r.ok){out.textContent=d.error||'Error';return}const s=d.summary||{};summary.innerHTML=['scope_type','network_type','matched_project','matched_site','match_score'].map(k=>`<div class="kv"><span>${k}</span><b>${s[k]??'-'}</b></div>`).join('');out.textContent=JSON.stringify(s,null,2);});</script></body></html>
