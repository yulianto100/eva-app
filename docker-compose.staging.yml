services:
  redis:
    container_name: eva-redis-staging

  web:
    container_name: eva-converter-staging
    environment:
      ENVIRONMENT: "staging"
      LOG_LEVEL: "DEBUG"
      LOG_FORMAT: "text"
      DXF_CONVERSION_ENABLED: "true"
      CLEANUP_MAX_AGE_HOURS: "6"
      JOB_MAX_AGE_HOURS: "12"
      JOB_MAX_RETRIES: "3"
      JOB_RETRY_DELAY_SECONDS: "15"
      CONVERSION_MAX_CONCURRENT_JOBS: "2"
      ALERT_ENABLED: "false"
      OUTBOUND_SYNC_ENABLED: "false"
      REQUIRE_ADMIN_API_TOKEN: "false"
    labels:
      prometheus.io/scrape: "true"
      prometheus.io/port: "5000"
      prometheus.io/path: "/metrics/prometheus"
      environment: "staging"

  worker:
    container_name: eva-worker-staging
    environment:
      ENVIRONMENT: "staging"
      LOG_LEVEL: "DEBUG"
      LOG_FORMAT: "text"
      DXF_CONVERSION_ENABLED: "true"
      CLEANUP_MAX_AGE_HOURS: "6"
      JOB_MAX_AGE_HOURS: "12"
      JOB_MAX_RETRIES: "3"
      JOB_RETRY_DELAY_SECONDS: "15"
      CONVERSION_MAX_CONCURRENT_JOBS: "2"
      ALERT_ENABLED: "false"
      OUTBOUND_SYNC_ENABLED: "false"
