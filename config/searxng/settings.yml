use_default_settings: true

general:
  instance_name: "EVA Search"
  debug: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "id"
  formats:
    - html
    - json

server:
  secret_key: "eva-converter-searxng-2026-secret-key"
  bind_address: "0.0.0.0"
  port: 8080
  image_proxy: false
  limiter: false
  public_instance: false

ui:
  static_use_hash: true

enabled_plugins:
  - 'Basic Calculator'
  - 'Hash plugin'

engines:
  - name: google
    engine: google
    shortcut: g
    disabled: false
  - name: bing
    engine: bing
    shortcut: b
    disabled: false
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false
  - name: wikipedia
    engine: wikipedia
    shortcut: w
    disabled: false

